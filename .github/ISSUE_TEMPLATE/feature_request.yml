name: Feature request
description: Propose a change or new capability
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: Which part of the stack should own this?
      options:
        - Carbon-XDNA
        - Diamond-accel0
        - Steel
        - Observability / tools
        - Examples / utilities
        - Organization / docs
        - Cross-cutting / unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional)
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Hardware targets, workloads, or links that help
